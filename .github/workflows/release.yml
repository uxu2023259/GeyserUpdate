name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the plugin
        run: mvn -B -Dmaven.test.skip=true package

      - name: Collect built JARs
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          while IFS= read -r -d '' jar; do
            relative="${jar#./}"
            if [[ "$relative" == target/* ]]; then
              name="${relative#target/}"
            else
              name="${relative//\//__}"
            fi
            cp "$jar" "$assets/$name"
          done < <(find . -type f -path '*/target/*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' -print0)
          if ! find "$assets" -maxdepth 1 -type f -name '*.jar' -print -quit | grep -q .; then
            echo "No built JAR was found under any Maven target directory." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$RUNNER_TEMP/release-assets"/*.jar --verify-tag --title "$TAG" --generate-notes
